    <circle cx="260" cy="188" r="5" fill="#e5e7eb" stroke="#555"/><text x="280" y="192" font-weight="bold" fill="#16a34a">D9</text>
    <circle cx="260" cy="220" r="5" fill="#e5e7eb" stroke="#555"/><text x="280" y="224">D8</text>
    <circle cx="260" cy="252" r="5" fill="#e5e7eb" stroke="#555"/><text x="280" y="256">D7</text>
    <circle cx="260" cy="284" r="5" fill="#e5e7eb" stroke="#555"/><text x="280" y="288">D6</text>
    <circle cx="260" cy="316" r="5" fill="#e5e7eb" stroke="#555"/><text x="280" y="320">D5</text>
    <circle cx="260" cy="348" r="5" fill="#e5e7eb" stroke="#555"/><text x="280" y="352">D4</text>
    <circle cx="260" cy="380" r="5" fill="#e5e7eb" stroke="#555"/><text x="280" y="384">D3</text>
    <circle cx="260" cy="412" r="5" fill="#e5e7eb" stroke="#555"/><text x="280" y="416">D2</text>
    <circle cx="260" cy="444" r="5" fill="#e5e7eb" stroke="#555"/><text x="280" y="448" font-weight="bold" fill="#222">GND</text>
    <circle cx="260" cy="476" r="5" fill="#e5e7eb" stroke="#555"/><text x="280" y="480">RST</text>
    <circle cx="260" cy="508" r="5" fill="#e5e7eb" stroke="#555"/><text x="280" y="512">RX / D0</text>
    <circle cx="260" cy="540" r="5" fill="#e5e7eb" stroke="#555"/><text x="280" y="544">TX / D1</text>
  </g>
  <g font-size="8" fill="#cfe8f0" text-anchor="end">
    <text x="248" y="95">1</text><text x="248" y="127">2</text><text x="248" y="159">3</text><text x="248" y="191">4</text><text x="248" y="223">5</text>
    <text x="248" y="255">6</text><text x="248" y="287">7</text><text x="248" y="319">8</text><text x="248" y="351">9</text><text x="248" y="383">10</text>
    <text x="248" y="415">11</text><text x="248" y="447">12</text><text x="248" y="479">13</text><text x="248" y="511">14</text><text x="248" y="543">15</text>
