<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 660" width="940" height="660" font-family="Helvetica, Arial, sans-serif">
  <rect width="940" height="660" fill="#ffffff"/>
  <text x="20" y="32" font-size="19" font-weight="bold" fill="#111">Arduino Nano 33 IoT to RC522 (SPI) wiring</text>
  <text x="20" y="52" font-size="12" fill="#444">Board drawn component side up with the micro-USB at the top. Pin labels are printed on the UNDERSIDE of the Nano; count pins from the USB end.</text>
  <rect x="190" y="56" width="40" height="22" rx="3" fill="#9ca3af" stroke="#4b5563"/>
  <text x="210" y="71" font-size="9" text-anchor="middle" fill="#111">USB</text>
  <rect x="150" y="76" width="120" height="500" rx="6" fill="#1f6f8b" stroke="#0f3d4d" stroke-width="2"/>
  <rect x="186" y="300" width="48" height="48" rx="3" fill="#111"/>
  <text x="210" y="328" font-size="8" text-anchor="middle" fill="#ddd">SAMD21</text>
  <rect x="168" y="440" width="84" height="110" rx="4" fill="#6b7280" stroke="#374151"/>
  <text x="210" y="492" font-size="9" text-anchor="middle" fill="#fff">NINA-W102</text>
  <text x="210" y="505" font-size="8" text-anchor="middle" fill="#e5e7eb">Wi-Fi / BLE</text>
  <text x="210" y="100" font-size="9" text-anchor="middle" fill="#cfe8f0">Nano 33 IoT</text>
  <g font-size="12" fill="#222">
    <circle cx="160" cy="92" r="5" fill="#e5e7eb" stroke="#555"/><text x="140" y="96" text-anchor="end" font-weight="bold" fill="#b58900">D13 / SCK</text>
    <circle cx="160" cy="124" r="5" fill="#e5e7eb" stroke="#555"/><text x="140" y="128" text-anchor="end" font-weight="bold" fill="#d62828">+3V3</text>
    <circle cx="160" cy="156" r="5" fill="#e5e7eb" stroke="#555"/><text x="140" y="160" text-anchor="end">AREF</text>
    <circle cx="160" cy="188" r="5" fill="#e5e7eb" stroke="#555"/><text x="140" y="192" text-anchor="end">A0</text>
    <circle cx="160" cy="220" r="5" fill="#e5e7eb" stroke="#555"/><text x="140" y="224" text-anchor="end">A1</text>
    <circle cx="160" cy="252" r="5" fill="#e5e7eb" stroke="#555"/><text x="140" y="256" text-anchor="end">A2</text>
    <circle cx="160" cy="284" r="5" fill="#e5e7eb" stroke="#555"/><text x="140" y="288" text-anchor="end">A3</text>
    <circle cx="160" cy="316" r="5" fill="#e5e7eb" stroke="#555"/><text x="140" y="320" text-anchor="end">A4 / SDA(I2C)</text>
    <circle cx="160" cy="348" r="5" fill="#e5e7eb" stroke="#555"/><text x="140" y="352" text-anchor="end">A5 / SCL</text>
    <circle cx="160" cy="380" r="5" fill="#e5e7eb" stroke="#555"/><text x="140" y="384" text-anchor="end">A6</text>
    <circle cx="160" cy="412" r="5" fill="#e5e7eb" stroke="#555"/><text x="140" y="416" text-anchor="end">A7</text>
    <circle cx="160" cy="444" r="5" fill="#e5e7eb" stroke="#555"/><text x="140" y="448" text-anchor="end">VUSB</text>
    <circle cx="160" cy="476" r="5" fill="#e5e7eb" stroke="#555"/><text x="140" y="480" text-anchor="end">RST</text>
    <circle cx="160" cy="508" r="5" fill="#e5e7eb" stroke="#555"/><text x="140" y="512" text-anchor="end">GND</text>
    <circle cx="160" cy="540" r="5" fill="#e5e7eb" stroke="#555"/><text x="140" y="544" text-anchor="end">VIN</text>
