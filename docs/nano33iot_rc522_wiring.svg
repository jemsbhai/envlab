    <path d="M 152 124 H 100 V 605 H 560 V 450 H 644" stroke="#d62828"/>
    <path d="M 268 156 H 400 V 170 H 644" stroke="#f77f00"/>
    <path d="M 268 124 H 440 V 250 H 644" stroke="#1d4ed8"/>
