    <circle cx="260" cy="92" r="5" fill="#e5e7eb" stroke="#555"/><text x="280" y="96" font-weight="bold" fill="#7c3aed">D12 / MISO</text>
    <circle cx="260" cy="124" r="5" fill="#e5e7eb" stroke="#555"/><text x="280" y="128" font-weight="bold" fill="#1d4ed8">D11 / MOSI</text>
