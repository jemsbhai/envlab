    <text x="172" y="95">1</text><text x="172" y="127">2</text><text x="172" y="159">3</text><text x="172" y="191">4</text><text x="172" y="223">5</text>
    <text x="172" y="255">6</text><text x="172" y="287">7</text><text x="172" y="319">8</text><text x="172" y="351">9</text><text x="172" y="383">10</text>
    <text x="172" y="415">11</text><text x="172" y="447">12</text><text x="172" y="479">13</text><text x="172" y="511">14</text><text x="172" y="543">15</text>
  </g>
