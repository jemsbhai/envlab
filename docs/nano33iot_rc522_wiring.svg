  <g font-size="12" fill="#222">
    <rect x="20" y="582" width="900" height="66" rx="6" fill="#f5f5f5" stroke="#ddd"/>
    <rect x="34" y="596" width="14" height="14" fill="#e6b800"/><text x="54" y="608">D13 (left pin 1) to SCK</text>
    <rect x="200" y="596" width="14" height="14" fill="#d62828"/><text x="220" y="608">+3V3 (left pin 2) to 3.3V</text>
    <rect x="384" y="596" width="14" height="14" fill="#f77f00"/><text x="404" y="608">D10 (right pin 3) to SDA</text>
    <rect x="566" y="596" width="14" height="14" fill="#1d4ed8"/><text x="586" y="608">D11 (right pin 2) to MOSI</text>
    <rect x="34" y="622" width="14" height="14" fill="#7c3aed"/><text x="54" y="634">D12 (right pin 1) to MISO</text>
    <rect x="200" y="622" width="14" height="14" fill="#16a34a"/><text x="220" y="634">D9 (right pin 4) to RST</text>
    <rect x="384" y="622" width="14" height="14" fill="#222"/><text x="404" y="634">GND (right pin 12) to GND</text>
    <text x="586" y="634" fill="#9ca3af">IRQ: leave unconnected</text>
    <text x="760" y="608" font-weight="bold" fill="#d62828">3.3 V only. Never 5 V / VUSB.</text>
  </g>
