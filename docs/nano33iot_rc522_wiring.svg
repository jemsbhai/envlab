  <rect x="640" y="140" width="260" height="360" rx="8" fill="#1e3a8a" stroke="#0f1f4d" stroke-width="2"/>
  <rect x="705" y="195" width="170" height="270" rx="22" fill="none" stroke="#d4a017" stroke-width="6"/>
  <rect x="719" y="209" width="142" height="242" rx="18" fill="none" stroke="#d4a017" stroke-width="4"/>
  <rect x="748" y="300" width="36" height="36" fill="#111"/>
  <text x="766" y="322" font-size="7" text-anchor="middle" fill="#ddd">MFRC522</text>
  <text x="790" y="170" font-size="11" text-anchor="middle" fill="#dbe4ff">RC522 RFID module (labels printed on it)</text>
  <g font-size="12" font-weight="bold">
    <circle cx="652" cy="170" r="5" fill="#e5e7eb" stroke="#555"/><text x="665" y="174" fill="#ffb14d">SDA</text>
    <circle cx="652" cy="210" r="5" fill="#e5e7eb" stroke="#555"/><text x="665" y="214" fill="#ffd84d">SCK</text>
    <circle cx="652" cy="250" r="5" fill="#e5e7eb" stroke="#555"/><text x="665" y="254" fill="#93b4ff">MOSI</text>
    <circle cx="652" cy="290" r="5" fill="#e5e7eb" stroke="#555"/><text x="665" y="294" fill="#c9a8ff">MISO</text>
    <circle cx="652" cy="330" r="5" fill="#e5e7eb" stroke="#555"/><text x="665" y="334" fill="#9ca3af">IRQ</text>
    <circle cx="652" cy="370" r="5" fill="#e5e7eb" stroke="#555"/><text x="665" y="374" fill="#e5e7eb">GND</text>
    <circle cx="652" cy="410" r="5" fill="#e5e7eb" stroke="#555"/><text x="665" y="414" fill="#86efac">RST</text>
    <circle cx="652" cy="450" r="5" fill="#e5e7eb" stroke="#555"/><text x="665" y="454" fill="#ff8a8a">3.3V</text>
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 152 92 H 112 V 44 H 600 V 210 H 644"/>
    <path d="M 152 124 H 100 V 605 H 560 V 450 H 644"/>
    <path d="M 268 156 H 400 V 170 H 644"/>
