server_name: water-monitor
listen: 0.0.0.0:4222
http: 0.0.0.0:8222
max_payload: 64KB

jetstream {
  store_dir: /data/jetstream
  max_memory_store: 32MB
  max_file_store: 2GB
}

mqtt {
  listen: 0.0.0.0:1883
  ack_wait: 10s
  max_ack_pending: 32
}

websocket {
  listen: 0.0.0.0:8080
  no_tls: true
  allowed_origins: [
    "https://dewin.cbnsndwch.dev",
    "http://localhost:3000", "http://localhost:5173",
    "http://127.0.0.1:3000", "http://127.0.0.1:5173",
    "http://10.104.0.82", "http://10.104.0.82:3000",
    "http://pi-09.local", "http://pi-09.local:3000"
  ]
}

authorization {
  users: [
    {user: sensor, password: $SENSOR_PASSWORD, allowed_connection_types: ["MQTT"], permissions: {
      publish: ["env.v1.*.telemetry"]
      subscribe: {deny: [">"]}
    }},
    {user: pipeline, password: $PIPELINE_PASSWORD, allowed_connection_types: ["STANDARD", "MQTT"]},
    {user: homeassistant, password: $HA_PASSWORD, allowed_connection_types: ["MQTT"], permissions: {
      publish: ["homeassistant.status"]
      subscribe: ["homeassistant.>", "env.ha.>"]
    }},
    {user: viewer, password: $VIEWER_PASSWORD, allowed_connection_types: ["WEBSOCKET"], permissions: {
      publish: {deny: [">"]}
      subscribe: {allow: ["env.processed.>"]}
    }}
  ]
}
